<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 JAILBREAK</title>
<style>
  html,body{margin:0;padding:0;min-height:100%;background:#050608;color:#c8ced8;font:15px/1.45 "Segoe UI",system-ui,sans-serif;overflow:hidden}
  #bg{position:fixed;inset:0;z-index:0;background-color:#000;background-image:url("bg.png"), url("bg.svg");background-position:center top, center top;background-size:cover, cover;background-repeat:no-repeat, no-repeat;filter:brightness(0.85) contrast(1.05)}
  #bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.55) 65%, rgba(0,0,0,0.85) 100%)}
  #snow{position:fixed;inset:0;z-index:1;pointer-events:none}
  #brand{position:fixed;top:0;left:0;right:0;z-index:3;text-align:center;padding:8px 10px;background:rgba(14,17,22,0.92);border-bottom:1px solid #1e2732;backdrop-filter:blur(6px)}
  #brand b{font-size:15px;font-weight:700;letter-spacing:.14em;color:#e6ebf2;vertical-align:middle}
  #stage{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:60px 20px 20px;box-sizing:border-box}
  #notepad{width:min(540px,92vw);background:rgba(22,26,32,0.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.14);border-radius:10px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06)}
  #notepad-title{height:32px;display:flex;align-items:center;gap:8px;padding:0 12px;background:rgba(255,255,255,0.08);border-bottom:1px solid rgba(255,255,255,0.1);font:12px/1 Consolas,monospace;color:#aeb8c6}
  #notepad-title i{width:12px;height:12px;border-radius:2px;background:#7fd0a0;opacity:0.9}
  #notepad-title b{font-weight:600;letter-spacing:0.02em}
  #notepad-body{padding:14px 16px;font:13px/1.6 Consolas,monospace;color:#d6deea;white-space:pre-wrap;word-break:break-word}
  #notepad-body .k{color:#7f8ea3} #notepad-body .v{color:#e6ebf2;font-weight:700}
  #state{font-size:15px;font-weight:700;letter-spacing:0.04em;text-align:center;min-height:22px}
  #state.bad{color:#d08a7f} #state.warn{color:#d8c07f} #state.ok{color:#7fd0a0}
  #cache{font:12px/1 Consolas,monospace;color:#5c6672;text-align:center;min-height:14px}
  #cache.cacheok{color:#7fd0a0}
  #runBtn{appearance:none;border:0;cursor:pointer;padding:16px 48px;border-radius:999px;background:linear-gradient(180deg,#f0f3f8 0%, #d7dde7 100%);color:#0b0d10;font:800 16px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:0.16em;text-transform:uppercase;box-shadow:0 8px 28px rgba(0,0,0,0.55), 0 1px 0 rgba(255,255,255,0.9) inset;display:none}
  #runBtn.show{display:block}
  #hint{font:12px/1.4 "Segoe UI",system-ui,sans-serif;color:rgba(255,255,255,0.55);text-align:center}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="snow"></canvas>
<div id="brand"><b>PS4 JAILBREAK</b></div>
<div id="stage">
  <div id="notepad">
    <div id="notepad-title"><i></i><b>info.txt — Notepad</b><span style="margin-left:auto;opacity:0.6">— □ ×</span></div>
    <div id="notepad-body"><span class="k">firmware</span> <span class="v" id="fwv">detecting...</span>
<span class="k">status</span> <span class="v" id="st">detecting...</span>
<span class="k">cache</span> <span class="v" id="cv">checking...</span></div>
  </div>
  <div id="state">detecting firmware...</div>
  <button id="runBtn">RUN ANYWAY — jb.html</button>
  <div id="hint">на PS4 с 13.02 / 13.50 / 13.52 — автопереход в jb.html</div>
</div>

<script>
// мгновенный редирект — без applicationCache гейта
(function(){
  var target="jb.html"+location.search;
  try{ location.replace(target); return; }catch(e){}
  // fallback если replace заблокирован — показать кнопку
  var stateEl=document.getElementById("state");
  var fwEl=document.getElementById("fwv");
  var stEl=document.getElementById("st");
  var cvEl=document.getElementById("cv");
  var runBtn=document.getElementById("runBtn");
  function setState(t,c){ stateEl.textContent=t; stateEl.className=c||""; if(stEl) stEl.textContent=t; }
  var m=/PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
  var key=null; if(m){ var ms=parseInt(m[2],16).toString(16); if(ms.length<2) ms="0"+ms; key=m[1]+"."+ms; }
  if(fwEl) fwEl.textContent = key || "unknown (PC)";
  function go(){ setState("loading jailbreak...","warn"); location.replace(target); }
  if(runBtn){ runBtn.classList.add("show"); runBtn.onclick=go; }
  setState("redirecting to jb.html...","warn");
  setTimeout(go, 300);
})();
// snow
(function(){var c=document.getElementById("snow"),ctx=c.getContext("2d"),w,h,flakes=[];function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight;flakes=Array.from({length:Math.min(120,Math.floor(w*h/13000))},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.6+0.6,vy:Math.random()*0.6+0.3,vx:(Math.random()-0.5)*0.3,a:Math.random()*0.4+0.3}))}window.addEventListener("resize",resize);resize();(function tick(){ctx.clearRect(0,0,w,h);ctx.fillStyle="#fff";for(var f of flakes){f.y+=f.vy;f.x+=f.vx;if(f.y>h+10){f.y=-10;f.x=Math.random()*w}ctx.globalAlpha=f.a;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;requestAnimationFrame(tick);})();})();
</script>
</body>
</html>
